<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Vote on poll</title>
	<script type="text/javascript" src="/js/jquery.min.js"></script>
	<style>
		body { font-family: arial, helvetica, sans-serif; font-size: 10pt; margin: 0; padding: 4px; text-align: center; background: transparent; }
		ul { padding: 0; margin: 0 0 6px; list-style: none; }
		li { display: block; text-align: left; max-width: 420px; margin: 0 auto; }
		label { cursor: pointer; }
	</style>
</head>
<body>
	<form name="vote" action="/poll.php" method="post">
		<input type="hidden" name="poll-id" value="{{ poll.poll_id }}">
		<ul>
			{% for option in options %}
				<li>
					<input name="choices[]" type="{% if poll.multiple_choice %}checkbox{% else %}radio{% endif %}" id="opt{{ option.option_id }}" value="{{ option.option_id }}">
					<label for="opt{{ option.option_id }}">{{ option.option_text|e }}</label>
				</li>
			{% endfor %}
		</ul>
		{% include 'poll/expiration.html' %}
		<div>
			<input {% if (poll.expires and time() >= poll.expires) or voted %}disabled{% endif %} type="submit" name="vote" value="Vote">
			<a href="?id={{ poll.poll_id }}&results"><input type="button" value="Results"></a>
			{% if poll.multiple_choice %}<br><span style="font-size:80%;">(Multiple choice)</span>{% endif %}
			{% if voted %}<br><span style="font-size:80%;">(You have already voted on this poll)</span>{% endif %}
		</div>
	</form>
</body>
</html>
