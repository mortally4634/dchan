<div class="imgboard-page" style="max-width:760px;margin:16px auto;">
	{% if is_admin %}
		<p style="text-align:right;margin:0 0 6px;"><a href="{{ edit_url }}">[ Edit this page ]</a></p>
	{% endif %}
	{% if entries %}
		{% for n in entries %}
			<div style="border:1px solid rgba(127,127,127,0.4);background:rgba(127,127,127,0.07);margin-bottom:14px;">
				<div class="imgboard-box-head" style="font-weight:bold;padding:4px 8px;border-bottom:1px solid rgba(127,127,127,0.4);">
					{% if n.subject %}{{ n.subject|e }}{% else %}News{% endif %}
					<span style="float:right;font-weight:normal;font-size:12px;">
						{{ n.name|e }} - {{ n.time|date(config.post_date) }}
					</span>
				</div>
				<div style="padding:10px 16px;line-height:1.5;">{{ n.body|raw }}</div>
			</div>
		{% endfor %}
	{% else %}
		<div style="border:1px solid rgba(127,127,127,0.4);background:rgba(127,127,127,0.07);">
			<div class="imgboard-box-head" style="font-weight:bold;padding:4px 8px;border-bottom:1px solid rgba(127,127,127,0.4);">News</div>
			<div style="padding:10px 16px;">No news to show.</div>
		</div>
	{% endif %}
</div>
