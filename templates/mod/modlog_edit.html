<div class="modlog-edit">
	<p>Edit, delete, or add moderation log entries. Showing the most recent 300.</p>

	<fieldset>
		<legend>Add an entry</legend>
		<form method="post" action="?/modlog-edit">
			<input type="hidden" name="token" value="{{ token }}">
			<input type="hidden" name="add" value="1">
			<label>Action: <input type="text" name="new_text" size="40" maxlength="255" placeholder="e.g. Rejected file" required></label>
			<label>Board: <input type="text" name="new_board" size="6" maxlength="58" placeholder="(optional)"></label>
			<label>When: <input type="text" name="new_time" size="20" placeholder="YYYY-MM-DD HH:MM (blank = now)"></label>
			<input type="submit" value="Add">
		</form>
	</fieldset>

	<table class="modlog" style="width:100%;">
		<tr>
			<th>Time</th>
			<th>Board</th>
			<th>Action</th>
			<th>&nbsp;</th>
		</tr>
		{% for log in logs %}
			<tr>
				<td class="minimal"><span title="{{ log.time|date(config.post_date) }}">{{ log.time|ago }}</span></td>
				<td class="minimal">{% if log.board %}/{{ log.board|e }}/{% else %}-{% endif %}</td>
				<td>
					<form method="post" action="?/modlog-edit" style="display:flex;gap:4px;">
						<input type="hidden" name="token" value="{{ token }}">
						<input type="hidden" name="edit_id" value="{{ log.id }}">
						<input type="text" name="text" value="{{ log.text|e('html_attr') }}" style="flex:1;" maxlength="255">
						<input type="submit" value="Save">
					</form>
				</td>
				<td class="minimal">
					<form method="post" action="?/modlog-edit" onsubmit="return confirm('Delete this log entry?');" style="display:inline;">
						<input type="hidden" name="token" value="{{ token }}">
						<input type="hidden" name="delete_id" value="{{ log.id }}">
						<input type="submit" value="Delete" style="color:#b00;">
					</form>
				</td>
			</tr>
		{% endfor %}
	</table>
</div>
