<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 Not Found - example.com</title>
<style>
	html, body { height: 100%; margin: 0; }
	body {
		display: flex; align-items: center; justify-content: center;
		background: #eef2ff; color: #333;
		font-family: Arial, Helvetica, sans-serif; text-align: center;
	}
	.box { padding: 24px; }
	h1 { font-size: 72px; margin: 0; color: #a00; }
	h2 { font-size: 20px; margin: 8px 0 16px; color: #800000; }
	p  { margin: 0 0 16px; }
	a  { color: #34345c; }
</style>
</head>
<body>
	<div class="box">
		<h1>404</h1>
		<h2>Page not found</h2>
		<p>The page you were looking for doesn&rsquo;t exist.</p>
		<p><a href="/">Return to the front page</a></p>
	</div>
</body>
</html>
