post_max_size=10M
upload_max_filesize=10M
max_file_uploads=5

; Security hardening
; Don't advertise PHP via the X-Powered-By header.
expose_php=Off
; Never render PHP errors/warnings to visitors (avoids path/info disclosure);
; log them instead so they still reach the container logs.
display_errors=Off
display_startup_errors=Off
log_errors=On
; Harden session cookies (defence in depth; vichan sets its own cookie flags too).
session.cookie_httponly=1
session.use_strict_mode=1