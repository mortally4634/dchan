[www]
access.log = /proc/self/fd/2

; Ensure worker stdout and stderr are sent to the main error log.
catch_workers_output = yes
decorate_workers_output = no

user = www-data
group = www-data

; Listen on all interfaces so the nginx container can reach php-fpm
; across the Docker network (they are separate containers).
listen = 0.0.0.0:9000

; Dynamic pool: a light idle footprint that scales up under load. Sized for the
; ~3.7 GB host (php is cheap here — roughly 5-40 MB per worker). The ceiling was
; raised from 16 to 32 so a traffic spike no longer exhausts the pool, and
; workers recycle after a batch of requests to curb any gradual memory growth.
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000
