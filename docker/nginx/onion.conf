# Hidden-service front door (Tor + I2P).
#
# tor connects to web:8081, i2pd to web:8082 (internal ports, never published).
# This block:
#   1. Gives each visitor a stable pseudo-IP so one ban/flood-limit can't hit every
#      mirror user. The network half encodes the source: Tor = fdd0::/16, I2P = fdd1::/16
#      (both inside the fdd0::/8 private range, so never confused with a real address).
#      inc/mod/pending.php reads that prefix to tag posts [Tor] / [I2P] for staff.
#   2. On public pages: marks the request hidden-service (X-Imgboard-Hs: 1), which
#      vichan.conf turns into a scripts-off sandbox CSP + the no-JS image captcha.
#      vichan.conf only trusts that header from 127.0.0.1, so clearnet can't fake it.
#   3. /mod.php is served normally (scripts on) so the staff panel is usable over Tor;
#      it still gets the pseudo-IP, so the IP-locked mod session and logging work.

map $cookie_hsid $hs_id {
	"~^[0-9a-f]{32}$"  $cookie_hsid;
	default            $request_id;
}
map $hs_id $hs_lo {
	"~^(?<a>[0-9a-f]{4})(?<b>[0-9a-f]{4})(?<c>[0-9a-f]{4})(?<d>[0-9a-f]{4})"  "$a:$b:$c:$d";
	default                                                                     "0:0:0:1";
}
map $server_port $hs_net {
	8082     fdd1;   # I2P
	default  fdd0;   # Tor (8081)
}

server {
	listen 8081;
	listen 8082;
	server_name _;
	client_max_body_size 12m;

	set $hs_ip "$hs_net:0:0:0:$hs_lo";
	add_header Set-Cookie "hsid=$hs_id; Path=/; Max-Age=31536000; HttpOnly; SameSite=Lax" always;

	# Staff panel: normal page (scripts allowed), but still the pseudo-IP.
	location = /mod.php {
		proxy_pass http://127.0.0.1:80;
		proxy_http_version 1.1;
		proxy_set_header Host             $host;
		proxy_set_header X-Forwarded-For  $hs_ip;
		proxy_set_header X-Forwarded-Proto "";
		proxy_set_header Connection       "";
	}

	# Everything else: no-JS public mirror.
	location / {
		proxy_pass http://127.0.0.1:80;
		proxy_http_version 1.1;
		proxy_set_header Host             $host;
		proxy_set_header X-Forwarded-For  $hs_ip;
		proxy_set_header X-Forwarded-Proto "";
		proxy_set_header X-Imgboard-Hs      1;
		proxy_set_header Connection       "";
		proxy_set_header Accept-Encoding  "";   # plain text so sub_filter can edit it

		sub_filter_once off;
		sub_filter '</head>' '<style>.imgboard-ts{display:none!important}.imgboard-ic{display:table-row!important}</style></head>';
		sub_filter 'data-imgboard-src=' 'src=';
	}
}
