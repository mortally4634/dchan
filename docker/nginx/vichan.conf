# Hidden-service marker: honoured only when the connection came from 127.0.0.1 (the
# onion.conf front door), never from a clearnet client. See onion.conf.
map "$realip_remote_addr:$http_x_imgboard_hs" $imgboard_hs {
	default 0;
	"127.0.0.1:1" 1;
}
# Hidden services run with JavaScript sandboxed off (also makes <noscript> content show).
map $imgboard_hs $imgboard_csp {
	1       "sandbox allow-forms allow-same-origin allow-popups allow-downloads; base-uri 'self'; object-src 'none'";
	default "base-uri 'self'; object-src 'none'; frame-ancestors 'self'";
}

# Staff are redirected to the mod.php view of a board, except while previewing the site as a
# regular user (imgboard_viewas=user), when they get the same static pages as any visitor.
map $http_cookie $imgboard_staff_cookie {
	default 0;
	"~*(?:^|;[ ]*)(?:__Secure-|__Host-)?mod=" 1;
}
map $http_cookie $imgboard_viewas_user {
	default 0;
	"~*(?:^|;[ ]*)imgboard_viewas=user" 1;
}
map "$imgboard_staff_cookie:$imgboard_viewas_user" $imgboard_staff_redirect {
	default 0;
	"1:0"   1;
}

upstream php-upstream {
	server php:9000;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server ipv6only=on;
	server_name vichan;
	root /var/www/html;

	# Security headers. `always` so they ride error/redirect responses too. nginx
	# add_header does NOT merge across contexts: a location that sets its own
	# add_header loses these, so the locations below set none (the static blocks
	# re-add only nosniff, which is the one that matters for JS/CSS/images).
	# HSTS: once a browser has seen this over https it never sends the staff cookie
	# (which holds the login hash) over plain http. Cloudflare already redirects http.
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
	# Conservative CSP: lock down base-uri, plugins (object/embed) and framing
	# without constraining script/style/img sources (vichan relies on inline JS,
	# data: images and third-party embeds, so those stay unrestricted).
	add_header Content-Security-Policy $imgboard_csp always;

	index index.html index.php;

	charset utf-8;

	# Plain static 404 page for any path that doesn't resolve to a real file.
	error_page 404 /404.html;
	location = /404.html { internal; }

	# example.com killswitch: while the flag file exists, rewrite every public
	# HTML page to killswitch.php (the raw shutdown page). Static assets, mod.php
	# and post.php stay reachable so staff keep operating through the mod panel.
	set $ks 0;
	if (-f /var/www/html/killswitch.flag) { set $ks 1; }
	if ($uri ~* "\.(?:css|js|png|jpe?g|gif|webp|webm|mp4|ogg|ico|svg|woff2?|ttf|map|json|txt)$") { set $ks 0; }
	# mod/post keep staff operating; killswitch.php is the shutdown page itself;
	# b.php only 307-redirects to a static banner image, so let it through too
	# (otherwise banners render broken on staff pages while the site is down).
	if ($uri ~ "^/(?:mod|post|killswitch|b)\.php$") { set $ks 0; }
	if ($uri = /_staffcheck) { set $ks 0; }
	if ($ks = 1) { rewrite ^ /killswitch.php last; }

	# --- Security hardening -------------------------------------------------
	# Regex locations are tried in order, first match wins, so these deny rules
	# sit ahead of the board/static/PHP locations below. None of these paths is
	# ever referenced by a served page.
	#
	# Never expose backend internals (PHP includes, Twig templates, CLI tools,
	# the Docker build dir) or the installer/schema.
	location ~ ^/(?:inc|templates|tools|docker)/ { return 404; }
	location = /install.php  { return 404; }
	location = /install.sql  { return 404; }
	location = /composer.json { return 404; }
	location = /composer.lock { return 404; }
	# Hidden files/dirs (.git, .env, .ht*) — keep /.well-known reachable.
	location ~ /\.(?!well-known/) { return 404; }
	# Raw config/dumps/scripts must never be served as static files.
	location ~* \.(?:sql|sh|lock|bak|old|ini|sqlite3?|ya?ml)$ { return 404; }
	# Defence in depth: never execute PHP that somehow lands in an upload dir.
	location ~* ^/[a-z0-9]+/(?:src|thumb)/.*\.php$ { return 404; }
	# ------------------------------------------------------------------------

	location ~ ^([^.\?]*[^\/])$ {
		try_files $uri @addslash;
	}

	# example.com routing ---------------------------------------------------
	# /j/ and /test/ are staff-only boards. Non-staff are bounced to the
	# homepage; staff get the mod.php view (index) or the static page
	# (threads/assets). Matched before the generic board rule below. A named
	# capture carries the board name into the redirect (a numbered capture would
	# be clobbered by the `if` regex below).
	location ~ ^/(?<staffb>j|test)/(?:index\.html)?$ {
		if ($http_cookie !~* "(?:^|;[ ]*)(?:__Secure-|__Host-)?mod=") {
			return 302 /;
		}
		return 302 /mod.php?/$staffb/index.html;
	}
	# Everything else under them (threads, JSON, uploads) is served only after staffcheck.php
	# confirms a genuine staff session. A cookie merely NAMED mod is not enough.
	location ~ ^/(?:j|test)/ {
		auth_request /_staffcheck;
		error_page 401 403 = @staff_bounce;
		try_files $uri $uri/ =404;
	}
	location @staff_bounce { return 302 /; }
	location = /_staffcheck {
		internal;
		fastcgi_pass php-upstream;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME /var/www/staffcheck.php;
		fastcgi_param SCRIPT_NAME /staffcheck.php;
		fastcgi_param IMGBOARD_HS $imgboard_hs;
		fastcgi_pass_request_body off;
		fastcgi_param CONTENT_LENGTH "";
	}

	# When a moderator is logged in, send any board index to its mod.php view.
	# Named capture (not $1): a matching `if` regex would otherwise overwrite the
	# numbered capture, leaving the board name empty in the redirect.
	# `o/` is the overboard (a theme-built static dir, not a board), so it must
	# be excluded here or a logged-in mod would be bounced to mod.php?/o/ and hit
	# "Invalid board!". Reserved dirs are excluded for the same reason.
	location ~ ^/(?!static|js|stylesheets|inc|templates|tools|tmp|mod|o/)(?<brd>[a-z0-9]+)/(?:index\.html)?$ {
		if ($imgboard_staff_redirect) {
			return 302 /mod.php?/$brd/index.html;
		}
		try_files $uri $uri/ =404;
	}
	# ------------------------------------------------------------------------

	# Expire rules for static content
	# Media: images, icons, video, audio, HTC
	location ~* \.(?:jpg|jpeg|gif|png|webp|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
		expires 1M;
		access_log off;
		log_not_found off;
		add_header Cache-Control "public";
		add_header X-Content-Type-Options "nosniff" always;
	}
	# CSS and Javascript
	location ~* \.(?:css|js)$ {
		expires 1y;
		access_log off;
		log_not_found off;
		add_header Cache-Control "public";
		add_header X-Content-Type-Options "nosniff" always;
	}

	location ~* \.(html)$ {
		expires -1;
	}

	location @addslash {
		return 301 $uri/;
	}

	# The homepage is a dynamic index.php that is symlinked to /code (only
	# resolvable inside the php container), so nginx can't stat it as a
	# directory index. Pass "/" straight to php-fpm, which resolves it.
	location = / {
		fastcgi_pass php-upstream;
		include fastcgi_params;
		fastcgi_param IMGBOARD_HS $imgboard_hs;
		fastcgi_param SCRIPT_FILENAME /var/www/index.php;
		fastcgi_param SCRIPT_NAME /index.php;
		fastcgi_param DOCUMENT_URI /index.php;
		fastcgi_read_timeout 600;
	}

	location / {
		try_files $uri $uri/ =404;
	}

	# PHP rejects bodies over 10M (docker/php/php.ini); stop nginx buffering more than
	# that to disk first. 12m leaves room for multipart overhead.
	client_max_body_size 12m;

	# Imgboard: captcha.php is an expensive image + DB endpoint and a frequent
	# flood target. Rate-limit it per-IP and globally so it can never exhaust the
	# php-fpm worker pool and 504 the whole site; excess gets a cheap 429 without
	# reaching php. Exact match, so it takes priority over the regex below.
	location = /captcha.php {
		limit_req zone=captcha_ip  burst=5 nodelay;
		limit_req zone=captcha_all burst=30 nodelay;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Request-Id $x_request_id;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header Forwarded-Request-Id $x_request_id;
		fastcgi_pass php-upstream;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME /var/www/captcha.php;
		fastcgi_read_timeout 600;
		include fastcgi_params;
		fastcgi_param IMGBOARD_HS $imgboard_hs;
	}

	location ~ \.php$ {
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Request-Id $x_request_id;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header Forwarded-Request-Id $x_request_id;
		fastcgi_pass php-upstream;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME /var/www/$fastcgi_script_name;
		fastcgi_read_timeout 600;
		include fastcgi_params;
		fastcgi_param IMGBOARD_HS $imgboard_hs;
	}

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }
}
