# This and proxy.conf are based on
# https://github.com/dead-guru/devichan/blob/master/nginx/nginx.conf

user www-data;
worker_processes auto;

error_log /dev/stdout warn;
pid       /var/run/nginx.pid;

events {
	worker_connections  1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	# Don't advertise the nginx version in responses or error pages.
	server_tokens off;

	# Imgboard: rate-limit the expensive captcha image endpoint so a flood
	# of /captcha.php requests can't exhaust the php-fpm worker pool (which 504s
	# the whole site). Keyed on the real client IP (proxy.conf resolves it from
	# X-Forwarded-For behind the Cloudflare tunnel); a second global zone caps
	# total captcha load regardless of how many source IPs the flood is spread
	# across. Excess requests get a cheap 429 and never reach php.
	limit_req_zone $binary_remote_addr zone=captcha_ip:10m rate=2r/s;
	limit_req_zone $server_name        zone=captcha_all:1m rate=30r/s;
	limit_req_status 429;

	# Switch logging to console out to view via Docker
	access_log /dev/stdout;
	error_log /dev/stdout warn;
	sendfile        on;
	keepalive_timeout  5;

	gzip              on;
	gzip_http_version 1.0;
	gzip_vary         on;
	gzip_comp_level   6;
	gzip_types        text/xml text/plain text/css application/xhtml+xml application/xml application/rss+xml application/atom_xml application/x-javascript application/x-httpd-php;
	gzip_disable      "MSIE [1-6]\.";


	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-available/*.conf;
}