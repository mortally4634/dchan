log = stdout
loglevel = warn
ipv4 = true
ipv6 = false
# Serve our own site only: do not relay other people's traffic, and cap bandwidth.
notransit = true
bandwidth = O

# The local web console is only reachable inside this container; entry.sh reads
# the site's public .b32.i2p name from it.
[http]
enabled = true
address = 127.0.0.1
port = 7070

[httpproxy]
enabled = false
[socksproxy]
enabled = false
[sam]
enabled = false
[bob]
enabled = false
[i2cp]
enabled = false
[i2pcontrol]
enabled = false
